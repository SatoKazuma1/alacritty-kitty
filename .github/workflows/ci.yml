name: CI

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libfreetype6-dev libfontconfig1-dev \
            libxcb-xfixes0-dev libxkbcommon-dev scdoc
      - name: Test
        run: cargo test --workspace
      - name: Test (no default features)
        run: cargo test -p alacritty_terminal --no-default-features
      - name: Clippy
        run: |
          rustup component add clippy
          cargo clippy --all-targets
      - name: Man pages
        run: for page in extra/man/*.scd; do scdoc < "$page" > /dev/null; done
