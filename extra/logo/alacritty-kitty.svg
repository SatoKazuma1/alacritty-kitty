<?xml version="1.0" encoding="UTF-8"?>
<!-- Alacritty Kitty: the Alacritty terminal with a cat peeking over it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7a7a7"/>
      <stop offset="1" stop-color="#5a5a5a"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d00"/>
      <stop offset="1" stop-color="#ffb300"/>
    </linearGradient>
    <linearGradient id="chevron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3300"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#9fd8ff"/>
      <stop offset="1" stop-color="#2f8fff"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a5c32"/>
      <stop offset="1" stop-color="#6e3f20"/>
    </linearGradient>
  </defs>

  <!-- Cat ears and head, behind the terminal. -->
  <path d="M58 70 L66 6 L112 34 Z" fill="url(#fur)"/>
  <path d="M198 70 L190 6 L144 34 Z" fill="url(#fur)"/>
  <path d="M70 52 L74 22 L98 38 Z" fill="#d59a7a"/>
  <path d="M186 52 L182 22 L158 38 Z" fill="#d59a7a"/>
  <ellipse cx="128" cy="60" rx="76" ry="44" fill="url(#fur)"/>

  <!-- Eyes. -->
  <circle cx="100" cy="48" r="15" fill="#f4f4f4"/>
  <circle cx="156" cy="48" r="15" fill="#f4f4f4"/>
  <circle cx="102" cy="49" r="8" fill="#c6d42f"/>
  <circle cx="154" cy="49" r="8" fill="#c6d42f"/>
  <ellipse cx="102" cy="49" rx="3" ry="6.5" fill="#1b1b1b"/>
  <ellipse cx="154" cy="49" rx="3" ry="6.5" fill="#1b1b1b"/>
  <circle cx="98" cy="44" r="2.5" fill="#ffffff"/>
  <circle cx="150" cy="44" r="2.5" fill="#ffffff"/>
  <path d="M121 66 L135 66 L128 74 Z" fill="#e7a0a0"/>

  <!-- Terminal. -->
  <rect x="26" y="78" width="204" height="166" rx="24" fill="url(#bezel)"/>
  <rect x="38" y="81" width="180" height="6" rx="3" fill="url(#stripe)"/>
  <rect x="40" y="94" width="176" height="138" rx="12" fill="#16212b"/>

  <!-- Alacritty chevron and flame. -->
  <path d="M128 104 L178 222 L156 222 L128 152 L100 222 L78 222 Z" fill="url(#chevron)"/>
  <path d="M128 160 L139 186 L128 214 L117 186 Z" fill="url(#flame)"/>

  <!-- Paws resting on the terminal. -->
  <g fill="#4b3b38">
    <ellipse cx="66" cy="84" rx="28" ry="15"/>
    <ellipse cx="190" cy="84" rx="28" ry="15"/>
  </g>
  <g stroke="#2e2422" stroke-width="2.5" stroke-linecap="round">
    <path d="M58 90 L58 97 M70 91 L70 98"/>
    <path d="M186 91 L186 98 M198 90 L198 97"/>
  </g>

  <!-- Whiskers. -->
  <g stroke="#3a2414" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M90 64 Q50 52 8 50"/>
    <path d="M90 70 Q48 68 6 74"/>
    <path d="M166 64 Q206 52 248 50"/>
    <path d="M166 70 Q208 68 250 74"/>
  </g>
</svg>
